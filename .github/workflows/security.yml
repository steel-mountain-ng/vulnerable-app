name: Security

on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:
  schedule:
    - cron: '30 0 * * 1'

permissions:
  contents: read
  actions: read
  security-events: write
  pull-requests: write

jobs:
  security:
    name: Security CI
    uses: steel-mountain-ng/security-workflows/.github/workflows/reusable-security-ci.yml@v1
    with:
      fail-severity: HIGH
      upload-sarif: true
      codeql-languages: javascript
      dockerfile: Dockerfile
      context: .
      image-name: local/vulnerable-app:ci
