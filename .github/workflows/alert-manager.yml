name: Alert Manager

on:
  workflow_dispatch:
  schedule:
    # Weekly backlog hygiene (LOWs + AI FP review)
    - cron: '15 3 * * 1'

permissions:
  contents: write
  pull-requests: write
  security-events: write

jobs:
  alert-manager:
    name: Manage Code Scanning alerts
    uses: steel-mountain-ng/security-workflows/.github/workflows/reusable-alert-manager.yml@v1
    secrets: inherit
    with:
      dismiss-lows: true
      ai-review: true
      open-fix-prs: true
      # Tier 1: bulk classify via OpenRouter Auto (medium)
      model: openrouter/auto
      cost-tier: medium
      # Tier 2: FP confidence + dismiss gate
      fp-model: anthropic/claude-opus-5
      # 0 = send every open non-LOW alert (multi-agent batched)
      max-alerts: '0'
      batch-size: '40'
      concurrency: '8'
      fp-confidence: '0.85'
      fix-confidence: '0.7'
